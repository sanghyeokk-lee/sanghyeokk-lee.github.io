# 홈 화면 자기소개 (Markdown 사용 가능, 예: [링크](https://example.com)). 문단 사이는 빈 줄로 구분합니다.
bio: |
  I am interested in world models that learn how the world works, and correct themselves when the world proves them wrong.

  I keep coming back to one question: what is understanding, and how does it deepen?

  I think of understanding as having layers: recognizing objects, grasping the relations between them, abstracting those relations into rules that still hold when the objects change, and building new concepts on top of those rules.

  But none of these layers stays fixed once it is built. The move from atoms to quarks redefined the smallest units that make up the world; the move from classical to quantum mechanics rewrote its rules. Human understanding did not deepen by getting theories right from the start, but by revising wrong ones again and again.

  That is why I am most interested in the ability to revise theories. I want to build machines that do not stop at learning how the world works, but notice when what they have learned no longer fits what they observe, tell whether the error lies in an assumption about the world or in the rule itself, and fix it on their own. The goal of my research is to keep sharpening this question.
