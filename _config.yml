# Building Blocks: Blog와 별도로 관리하는 글 목록 (_building_blocks/ 폴더)
collections:
  building_blocks:
    output: true
    permalink: /building-blocks/:title/

defaults:
  - scope:
      path: "_posts"
      type: "posts"
    values:
      layout: "post"
      math: false
  - scope:
      path: "_building_blocks"
      type: "building_blocks"
    values:
      layout: "post"
      math: false

exclude:
  - README.md
  - vendor/
  - .claude/
