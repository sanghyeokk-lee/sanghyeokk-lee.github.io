# Site settings
# 이 파일의 값은 {{ site.title }}, {{ site.email }} 처럼 템플릿에서 참조됩니다.
# 이 파일을 수정한 뒤에는 `bundle exec jekyll serve`를 다시 시작해야 반영됩니다.

lang: ko
title: Sanghyeok Lee            # 브라우저 탭에 표시될 사이트 제목
name: Sanghyeok Lee             # 홈/CV에 표시될 이름
position: Undergraduate Student @ Seoul National University of Science and Technology(SeoulTech), Industrial and Information Systems Engineering
email: sanghyeok.lee.32@gmail.com
# 홈 화면 자기소개 (Markdown 사용 가능, 예: [링크](https://example.com))
description: ""
baseurl: ""                   # 사이트가 하위 경로에 있을 때만 사용 (예: /blog)
url: "https://sanghyeokk-lee.github.io"

# 소셜 링크 — 비워 두면 해당 링크가 숨겨집니다.
github_username: "sanghyeokk-lee"
twitter_username: ""
google_scholar: ""              # Google Scholar 프로필 URL의 user= 값
google_analytics: ""            # 예: G-XXXXXXXXXX

# Build settings
plugins:
  - jekyll-feed
  - jekyll-tailwindcss

# Blog settings
permalink: /blog/:year/:month/:day/:title/
excerpt_separator: <!--more-->

defaults:
  - scope:
      path: "_posts"
      type: "posts"
    values:
      layout: "post"
      math: false

exclude:
  - README.md
  - vendor/
  - .claude/
